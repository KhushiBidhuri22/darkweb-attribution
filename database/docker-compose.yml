services:
  postgres:
    image: postgres:16
    container_name: sih_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sih_darkweb
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-community
    container_name: sih_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/sih_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs: