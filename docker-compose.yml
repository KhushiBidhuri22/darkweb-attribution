services:
  postgres:
    image: postgres:16
    container_name: traceveil_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sih_darkweb
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d sih_darkweb"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: traceveil_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/sih_password
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "sih_password", "RETURN 1"]
      interval: 8s
      timeout: 8s
      retries: 15
      start_period: 20s

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traceveil_seed
    restart: "no"
    command: ["python", "scripts/entrypoint_seed.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sih_darkweb
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: sih_password
      NEO4J_DATABASE: neo4j
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traceveil_backend
    restart: unless-stopped
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sih_darkweb
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: sih_password
      NEO4J_DATABASE: neo4j
      CORS_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:80"
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: traceveil_frontend
    restart: unless-stopped
    ports:
      - "5500:5500"
    environment:
      HOST: 0.0.0.0
      PORT: 5500
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs: